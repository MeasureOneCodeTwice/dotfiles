bind r source-file ~/.config/tmux/tmux.conf

unbind C-b
set -g prefix C-h
# Switch panes using ALT HJKL
bind h select-pane -L
bind s select-pane -R
bind t select-pane -U
bind n select-pane -D

bind w switch-client -T paneCommands
bind -T paneCommands v split-window -h
bind -T paneCommands n split-window

set-option -ga terminal-overrides ",xterm-256color:Tc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Quality of life stuff
set -g history-limit 10000
set -s escape-time 0
set -g allow-rename off

# Search Mode VI (default is emacs)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip
-selection clipboard -i'
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'

run '~/.tmux/plugins/tpm/tpm'

bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "send-keys C-l"

set -g status-right "\"#{=-80:pane_current_path}\"  "
set -g status-right-length 80
